name: PVNetwork Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build dedicated APK from source
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PVNetwork-VPN-v0.2-dedicated-debug.apk
          sha256sum PVNetwork-VPN-v0.2-dedicated-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PVNetwork-V0.2-Dedicated-APK
          path: |
            PVNetwork-VPN-v0.2-dedicated-debug.apk
            SHA256SUMS.txt
          retention-days: 30
