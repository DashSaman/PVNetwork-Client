name: PVNetwork Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build dedicated APK from source
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PVNetwork-VPN-v0.2-dedicated-debug.apk
          sha256sum PVNetwork-VPN-v0.2-dedicated-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PVNetwork-V0.2-Dedicated-APK
          path: |
            PVNetwork-VPN-v0.2-dedicated-debug.apk
            SHA256SUMS.txt
          retention-days: 30
      - name: Store APK in repository
        run: |
          mkdir -p releases/v0.2
          cp PVNetwork-VPN-v0.2-dedicated-debug.apk releases/v0.2/
          cp SHA256SUMS.txt releases/v0.2/
          printf '%s\n' '# PVNetwork V0.2 Dedicated APK' '' 'Built automatically from the dedicated PVNetwork Android source.' '' 'Package: `com.pvnetwork.vpn`' '' 'This V0.2 build validates the independent UI, localization and config-import foundation. Tunnel engines are added in later protocol gates.' > releases/v0.2/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v0.2
          if ! git diff --cached --quiet; then
            git commit -m 'build: store PVNetwork V0.2 dedicated APK'
            git push origin HEAD:main
          fi
