name: PVNetwork Xray Mobile Core

on:
  push:
    branches: [main]
    paths:
      - 'core/xray-mobile/**'
      - '.github/workflows/xray-mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Prepare Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Resolve and test Go wrapper
        working-directory: core/xray-mobile
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@v0.0.0-20260709172247-6129f5bee9d5
          go mod tidy
          go test ./...
      - name: Install pinned gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260709172247-6129f5bee9d5
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260709172247-6129f5bee9d5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Bind Android AAR
        working-directory: core/xray-mobile
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          mkdir -p dist
          gomobile bind -target=android -androidapi 24 -o dist/pvxray.aar ./pvxray
          sha256sum dist/pvxray.aar | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pvnetwork-xray-android-aar
          path: |
            core/xray-mobile/dist/pvxray.aar
            core/xray-mobile/dist/SHA256SUMS.txt
          if-no-files-found: error
