name: PVNetwork Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-preview-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: bash scripts/build_preview.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PVNetwork-Preview-APK
          path: |
            PVNetwork-VPN-v0.1-preview-arm64.apk
            SHA256SUMS.txt
          retention-days: 14
