name: PVNetwork Universal Validation

on:
  push:
    branches: [main]
    paths:
      - 'core/xray-mobile/**'
      - 'universal/**'
      - 'scripts/**'
      - '.github/workflows/universal-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/xray-mobile/**'
      - 'universal/**'
      - 'scripts/**'
      - '.github/workflows/universal-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pvnetwork-universal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      # Build the native core from THIS checkout, never the "latest green"
      # artifact belonging to a possibly different commit or dependency.
      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - name: Build and test checkout-matched pvxray AAR
        working-directory: core/xray-mobile
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@v0.0.0-20260709172247-6129f5bee9d5
          go mod tidy
          go test ./...
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260709172247-6129f5bee9d5
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260709172247-6129f5bee9d5
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          gomobile init
          mkdir -p dist
          gomobile bind -v -target=android -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o dist/pvxray.aar ./pvxray
          sha256sum dist/pvxray.aar > dist/SHA256SUMS.txt
      - name: Verify mandatory AAR and binding class
        run: |
          test -s core/xray-mobile/dist/pvxray.aar
          (cd core/xray-mobile && sha256sum -c dist/SHA256SUMS.txt)
          unzip -p core/xray-mobile/dist/pvxray.aar classes.jar > /tmp/pvxray-classes.jar
          jar tf /tmp/pvxray-classes.jar | grep -Fx 'pvxray/Pvxray.class'
          # Native ABI is part of the application contract, not an optional
          # separately downloaded artifact.
          echo "Core source commit: $GITHUB_SHA"
          cat core/xray-mobile/dist/SHA256SUMS.txt
      - name: Generate Android host
        run: |
          mkdir -p buildhost
          cp -R universal/lib buildhost/lib
          cp -R universal/test buildhost/test
          cp universal/pubspec.yaml buildhost/pubspec.yaml
          TARGET=buildhost scripts/setup_host_projects.sh android
          sed -i 's/android:label="vpn"/android:label="PVNetwork"/' buildhost/android/app/src/main/AndroidManifest.xml
      - name: Validate and build APK
        working-directory: buildhost
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/arm64-v8a/libgojni[.]so'
      - name: Package
        run: |
          mkdir -p dist
          cp buildhost/build/app/outputs/flutter-apk/app-release.apk dist/PVNetwork-Android-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pvnetwork-android-dev
          path: dist/PVNetwork-Android-dev.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows host
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create buildhost --org com.pvnetwork --project-name vpn --platforms=windows --no-pub
          Remove-Item -Recurse -Force buildhost\lib,buildhost\test
          Copy-Item -Recurse universal\lib buildhost\lib
          Copy-Item -Recurse universal\test buildhost\test
          Copy-Item universal\pubspec.yaml buildhost\pubspec.yaml -Force
          $main = Get-Content buildhost\windows\runner\main.cpp -Raw
          $main = $main.Replace('L"vpn"', 'L"PVNetwork"')
          Set-Content buildhost\windows\runner\main.cpp $main
      - name: Validate and build Windows
        shell: pwsh
        working-directory: buildhost
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path buildhost\build\windows\x64\runner\Release\* -DestinationPath dist\PVNetwork-Windows-x64-dev.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pvnetwork-windows-dev
          path: dist/PVNetwork-Windows-x64-dev.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Linux host
        run: |
          flutter config --enable-linux-desktop
          flutter create buildhost --org com.pvnetwork --project-name vpn --platforms=linux --no-pub
          rm -rf buildhost/lib buildhost/test
          cp -R universal/lib buildhost/lib
          cp -R universal/test buildhost/test
          cp universal/pubspec.yaml buildhost/pubspec.yaml
      - name: Validate and build Linux
        working-directory: buildhost
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release
      - name: Package Linux
        run: |
          mkdir -p dist
          tar -C buildhost/build/linux/x64/release/bundle -czf dist/PVNetwork-Linux-x64-dev.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pvnetwork-linux-dev
          path: dist/PVNetwork-Linux-x64-dev.tar.gz
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS host
        run: |
          flutter config --enable-macos-desktop
          flutter create buildhost --org com.pvnetwork --project-name vpn --platforms=macos --no-pub
          rm -rf buildhost/lib buildhost/test
          cp -R universal/lib buildhost/lib
          cp -R universal/test buildhost/test
          cp universal/pubspec.yaml buildhost/pubspec.yaml
      - name: Validate and build macOS
        working-directory: buildhost
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build macos --release
      - name: Package macOS
        run: |
          mkdir -p dist
          APP=$(find buildhost/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/PVNetwork-macOS-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pvnetwork-macos-dev
          path: dist/PVNetwork-macOS-dev.zip
          if-no-files-found: error

  ios_unsigned:
    name: iOS unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS host
        run: |
          flutter create buildhost --org com.pvnetwork --project-name vpn --platforms=ios --no-pub
          rm -rf buildhost/lib buildhost/test
          cp -R universal/lib buildhost/lib
          cp -R universal/test buildhost/test
          cp universal/pubspec.yaml buildhost/pubspec.yaml
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName PVNetwork" buildhost/ios/Runner/Info.plist || true
      - name: Validate and build unsigned iOS
        working-directory: buildhost
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --release --no-codesign
      - name: Package unsigned iOS
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent buildhost/build/ios/iphoneos/Runner.app dist/PVNetwork-iOS-Unsigned-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pvnetwork-ios-unsigned-dev
          path: dist/PVNetwork-iOS-Unsigned-dev.zip
          if-no-files-found: error

# No GitHub Release job before a real VPN adapter passes E2E.
