plugins {
    id 'base'
}

tasks.register('assembleDebug', Exec) {
    group = 'build'
    description = 'Build the real PVNetwork Android client from pinned SFA/sing-box sources.'
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/build_real_android.sh'

    doLast {
        def outputDir = file("${buildDir}/outputs/apk/debug")
        outputDir.mkdirs()
        copy {
            from rootProject.file('dist/PVNetwork-VPN-v0.3-android5plus-legacy-universal.apk')
            into outputDir
            rename { 'app-debug.apk' }
        }
        if (!new File(outputDir, 'app-debug.apk').exists()) {
            throw new GradleException('PVNetwork real APK was not produced')
        }
    }
}
